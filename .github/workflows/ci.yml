name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Rebuild committed Action bundle
        run: npm run check:dist
      - name: Test bundled entry point
        run: node --test test/action.test.js
        env:
          ACTION_ENTRY: dist/index.js
      - name: Start local mock API
        id: mock
        run: node test/start-mock.js
      - name: Healthy HTTP and network checks
        id: healthy
        uses: ./
        with:
          api-token: action-ci-fake-token
          config-path: .smoke/healthy.json
          api-base-url: ${{ steps.mock.outputs.api-base-url }}
      - name: Blocking assertion failure
        id: blocking
        continue-on-error: true
        uses: ./
        with:
          api-token: action-ci-fake-token
          config-path: .smoke/blocking.json
          api-base-url: ${{ steps.mock.outputs.api-base-url }}
      - name: Non-blocking assertion failure
        id: non-blocking
        uses: ./
        with:
          api-token: action-ci-fake-token
          config-path: .smoke/non-blocking.json
          api-base-url: ${{ steps.mock.outputs.api-base-url }}
      - name: Incomplete measurements
        id: incomplete
        continue-on-error: true
        uses: ./
        with:
          api-token: action-ci-fake-token
          config-path: .smoke/incomplete.json
          api-base-url: ${{ steps.mock.outputs.api-base-url }}
      - name: Verify real CLI outcomes and reports
        run: node test/assert-smoke.js
        env:
          HEALTHY_REPORT: ${{ steps.healthy.outputs.json-report }}
          HEALTHY_OUTCOME: ${{ steps.healthy.outcome }}
          BLOCKING_REPORT: ${{ steps.blocking.outputs.json-report }}
          BLOCKING_OUTCOME: ${{ steps.blocking.outcome }}
          NON_BLOCKING_REPORT: ${{ steps.non-blocking.outputs.json-report }}
          NON_BLOCKING_OUTCOME: ${{ steps.non-blocking.outcome }}
          INCOMPLETE_REPORT: ${{ steps.incomplete.outputs.json-report }}
          INCOMPLETE_OUTCOME: ${{ steps.incomplete.outcome }}
      - name: Upload mock smoke reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-reports-${{ matrix.os }}
          path: |
            ${{ steps.healthy.outputs.json-report }}
            ${{ steps.healthy.outputs.junit-report }}
            ${{ steps.blocking.outputs.json-report }}
            ${{ steps.blocking.outputs.junit-report }}
            ${{ steps.non-blocking.outputs.json-report }}
            ${{ steps.non-blocking.outputs.junit-report }}
            ${{ steps.incomplete.outputs.json-report }}
            ${{ steps.incomplete.outputs.junit-report }}
          if-no-files-found: warn
      - name: Stop owned mock API
        if: always()
        run: node -e "const p=Number(process.env.MOCK_PID); if(Number.isInteger(p)&&p>0){try{process.kill(p)}catch(e){if(e.code!=='ESRCH')throw e}}"
        env:
          MOCK_PID: ${{ steps.mock.outputs.mock-pid }}
